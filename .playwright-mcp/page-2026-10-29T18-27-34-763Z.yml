    - heading "What this is" [level=2] [ref=e46]
    - paragraph [ref=e47]: ReaDex is a personal reader client. At first run the user supplies a single base URL; the app routes every outbound call through that URL. These pages describe the HTTP contract an endpoint must satisfy so ReaDex can render its catalog, title detail, chapter feed, pages and covers.
